<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      const prefix = "/USmart_Frontend";
      const pathname = window.location.pathname;

      // Nếu chưa có prefix → redirect
      if (!pathname.startsWith(prefix)) {
        const newPath =
          prefix + pathname + window.location.search + window.location.hash;
        location.replace(newPath);
      } else {
        // Nếu đã có prefix → load lại index.html để React xử lý
        fetch(prefix + "/index.html")
          .then((res) => res.text())
          .then((html) => document.write(html));
      }
    </script>
  </body>
</html>
