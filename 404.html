<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      const prefix = "/USmart_Frontend";
      const current = window.location.pathname;

      if (!current.startsWith(prefix)) {
        location.replace(prefix + current + window.location.search + window.location.hash);
      }
    </script>
  </body>
</html>
